<div class="app-shell">
  <header class="app-header">
    <a routerLink="/tasks" class="brand" aria-label="Task Management home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">Task Management</span>
        <span class="brand-tagline">Assignments &amp; delivery</span>
      </span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        All tasks
      </a>
      <a routerLink="/tasks/new" routerLinkActive="active">New task</a>
    </nav>
  </header>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
<app-confirm-dialog></app-confirm-dialog>
